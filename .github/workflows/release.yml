name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0


      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - run: npm install -g --allow-scripts=pnpm pnpm@12.0.0-beta.3

      - run: pnpm install --frozen-lockfile

      - id: plan
        run: |
          pnpm change status || true
          NAME=$(node -p "require('./package.json').name")
          if ! npm view "$NAME" version --json > /dev/null 2>&1; then
            echo "::notice::$NAME is not on the registry yet. Trusted publishing cannot create a package, so the first version must be published once by hand. Holding; no version will be applied."
            echo "pending=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if pnpm version -r --dry-run 2>&1 | grep -q '→'; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No pending change intents. Nothing to release."
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.plan.outputs.pending == 'true'
        run: pnpm typecheck && pnpm lint && pnpm test

      - if: steps.plan.outputs.pending == 'true'
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm version -r
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - if: steps.plan.outputs.pending == 'true'
        run: pnpm build

      - if: steps.plan.outputs.pending == 'true'
        run: pnpm publish --tag alpha --no-git-checks

      - if: steps.plan.outputs.pending == 'true'
        run: |
          git commit -am "release ${{ steps.version.outputs.version }}" || true
          git tag "v${{ steps.version.outputs.version }}"
          git push origin HEAD:main --follow-tags

      - name: wait for the registry
        if: steps.plan.outputs.pending == 'true'
        id: tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          for _ in $(seq 1 30); do
            URL=$(npm view "$NAME@$VERSION" dist.tarball 2>/dev/null || true)
            if [ -n "$URL" ]; then
              echo "name=$NAME" >> "$GITHUB_OUTPUT"
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$NAME@$VERSION did not appear on the registry within five minutes."
          exit 1

      - name: point latest at the published version
        if: steps.plan.outputs.pending == 'true'
        env:
          NAME: ${{ steps.tarball.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set +e
          case "$VERSION" in
            *-alpha.*) ;;
            *)
              echo "::notice::$VERSION is off the alpha lane, so the latest dist-tag is left as it is."
              exit 0
              ;;
          esac

          explain() {
            CURRENT=$(npm view "$NAME" dist-tags.latest 2>/dev/null || echo "unknown")
            echo "::notice::Moving the latest dist-tag needs a credential this workflow does not have, so latest still points at $CURRENT. npm said: $1 Point it at $VERSION by hand, or give the workflow an npm automation token."
            exit 0
          }

          CLAIM=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" \
            | node -p "try { JSON.parse(require('fs').readFileSync(0, 'utf8')).value || '' } catch { '' }")
          if [ -z "$CLAIM" ]; then
            explain "GitHub did not return an OIDC id token for audience npm:registry.npmjs.org."
          fi

          ESCAPED=$(node -p "encodeURIComponent(process.argv[1])" "$NAME")
          BODY=$(curl -sS -X POST -H "Authorization: Bearer $CLAIM" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$ESCAPED")
          TOKEN=$(printf '%s' "$BODY" | node -p "try { JSON.parse(require('fs').readFileSync(0, 'utf8')).token || '' } catch { '' }")
          if [ -z "$TOKEN" ]; then
            explain "$(printf '%s' "$BODY" | head -c 400 | tr '\n' ' ')"
          fi

          RC=$(mktemp)
          printf '//registry.npmjs.org/:_authToken=%s\n' "$TOKEN" > "$RC"
          OUT=$(npm dist-tag add "$NAME@$VERSION" latest --userconfig "$RC" 2>&1)
          STATUS=$?
          rm -f "$RC"
          if [ "$STATUS" -ne 0 ]; then
            explain "$(printf '%s' "$OUT" | head -c 400 | tr '\n' ' ')"
          fi
          echo "::notice::latest now points at $VERSION."

      - name: check for the tap token
        if: steps.plan.outputs.pending == 'true'
        id: tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -n "$TAP_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Add a TAP_TOKEN secret to have this workflow update the Homebrew formula on every release."
          fi

      - name: update the homebrew formula
        if: steps.plan.outputs.pending == 'true' && steps.tap.outputs.configured == 'true'
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          URL: ${{ steps.tarball.outputs.url }}
        run: |
          curl -fsSL "$URL" -o "$RUNNER_TEMP/package.tgz"
          SHA=$(sha256sum "$RUNNER_TEMP/package.tgz" | cut -d ' ' -f 1)

          TAP="$RUNNER_TEMP/tap"
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/Newbie012/homebrew-tap.git" "$TAP"

          FORMULA="$TAP/Formula/adiff.rb"
          sed -i -E "s#^  url \".*\"#  url \"$URL\"#" "$FORMULA"
          sed -i -E "s#^  sha256 \".*\"#  sha256 \"$SHA\"#" "$FORMULA"
          grep -qF "$URL" "$FORMULA"
          grep -qF "$SHA" "$FORMULA"

          git -C "$TAP" config user.name "github-actions[bot]"
          git -C "$TAP" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git -C "$TAP" diff --quiet; then
            echo "::notice::The formula already builds $VERSION."
            exit 0
          fi
          git -C "$TAP" commit -am "adiff $VERSION"
          git -C "$TAP" push
          echo "::notice::The Homebrew formula now builds $VERSION."
