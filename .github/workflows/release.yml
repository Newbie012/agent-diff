name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pending: ${{ steps.plan.outputs.pending }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0


      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - run: npm install -g --allow-scripts=pnpm pnpm@12.0.0-beta.3

      - run: pnpm install --frozen-lockfile

      - id: plan
        run: |
          pnpm change status || true
          NAME=$(node -p "require('./package.json').name")
          if ! npm view "$NAME" version --json > /dev/null 2>&1; then
            echo "::notice::$NAME is not on the registry yet. Trusted publishing cannot create a package, so the first version must be published once by hand. Holding; no version will be applied."
            echo "pending=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if pnpm version -r --dry-run 2>&1 | grep -q '→'; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No pending change intents. Nothing to release."
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.plan.outputs.pending == 'true'
        run: pnpm typecheck && pnpm lint && pnpm test

      - if: steps.plan.outputs.pending == 'true'
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm version -r
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is already on the registry, so main is behind the registry. Bring main up to the published version and its ledger entry before releasing again."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: record the version on main
        if: steps.plan.outputs.pending == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git add -A -- .changeset package.json
          if git diff --cached --quiet; then
            echo "::error::pnpm version -r left the tree unchanged, so there is no release commit to record for $VERSION."
            exit 1
          fi
          git commit -m "release $VERSION"
          for ATTEMPT in 1 2 3 4 5; do
            git tag -f -a "v$VERSION" -m "release $VERSION"
            if git push --atomic origin HEAD:refs/heads/main "refs/tags/v$VERSION"; then
              echo "::notice::main and tag v$VERSION carry $VERSION."
              exit 0
            fi
            echo "::warning::Push attempt $ATTEMPT of 5 was turned down. Rebasing onto main and trying again."
            git fetch origin main
            if ! git rebase FETCH_HEAD; then
              git rebase --abort || true
              echo "::error::The release commit for $VERSION does not rebase onto main, so main and this run both changed package.json or the change ledger. Nothing was published, so rerun this workflow once main is settled."
              exit 1
            fi
            sleep 5
          done
          echo "::error::main moved under this run five times and the release commit for $VERSION is still not on it. Nothing was published, so rerun this workflow once main is settled."
          exit 1

      - if: steps.plan.outputs.pending == 'true'
        run: pnpm build

      - if: steps.plan.outputs.pending == 'true'
        run: pnpm publish --tag alpha --no-git-checks

      - name: wait for the registry
        if: steps.plan.outputs.pending == 'true'
        id: tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          for _ in $(seq 1 30); do
            URL=$(npm view "$NAME@$VERSION" dist.tarball 2>/dev/null || true)
            if [ -n "$URL" ]; then
              echo "name=$NAME" >> "$GITHUB_OUTPUT"
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$NAME@$VERSION did not appear on the registry within five minutes."
          exit 1

      - name: point latest at the published version
        if: steps.plan.outputs.pending == 'true'
        env:
          NAME: ${{ steps.tarball.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +e
          case "$VERSION" in
            *-alpha.*) ;;
            *)
              echo "::notice::$VERSION is off the alpha lane, so the latest dist-tag is left as it is."
              exit 0
              ;;
          esac

          explain() {
            CURRENT=$(npm view "$NAME" dist-tags.latest 2>/dev/null || echo "unknown")
            echo "::error::latest still points at $CURRENT rather than $VERSION, so a plain install gets $CURRENT. npm said: $1 Add an npm automation token as the NPM_TOKEN secret, or run: npm dist-tag add $NAME@$VERSION latest"
            exit 0
          }

          TOKEN="$NPM_TOKEN"
          if [ -n "$TOKEN" ]; then
            echo "::notice::Moving the latest dist-tag with the NPM_TOKEN secret."
          else
            CLAIM=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" \
              | node -p "try { JSON.parse(require('fs').readFileSync(0, 'utf8')).value || '' } catch { '' }")
            if [ -z "$CLAIM" ]; then
              explain "GitHub did not return an OIDC id token for audience npm:registry.npmjs.org, and no NPM_TOKEN secret is set."
            fi

            ESCAPED=$(node -p "encodeURIComponent(process.argv[1])" "$NAME")
            BODY=$(curl -sS -X POST -H "Authorization: Bearer $CLAIM" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$ESCAPED")
            TOKEN=$(printf '%s' "$BODY" | node -p "try { JSON.parse(require('fs').readFileSync(0, 'utf8')).token || '' } catch { '' }")
            if [ -z "$TOKEN" ]; then
              explain "$(printf '%s' "$BODY" | head -c 400 | tr '\n' ' ')"
            fi
          fi

          RC=$(mktemp)
          printf '//registry.npmjs.org/:_authToken=%s\n' "$TOKEN" > "$RC"
          OUT=$(npm dist-tag add "$NAME@$VERSION" latest --userconfig "$RC" 2>&1)
          STATUS=$?
          rm -f "$RC"
          if [ "$STATUS" -ne 0 ]; then
            explain "$(printf '%s' "$OUT" | head -c 400 | tr '\n' ' ')"
          fi
          echo "::notice::latest now points at $VERSION."

  announce:
    needs: release
    if: needs.release.outputs.pending == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: open the release for its binaries
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "::notice::The release for v$VERSION is already open."
            exit 0
          fi
          gh release create "v$VERSION" \
            --verify-tag \
            --prerelease \
            --title "v$VERSION" \
            --notes "Install with \`brew install Newbie012/tap/adiff\`, or \`npm i -g @eliya-oss/agent-diff@alpha\` if you would rather run it on Node. The binaries below need no runtime at all."

  binaries:
    needs: [release, announce]
    if: needs.release.outputs.pending == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: bun-darwin-arm64
            asset: adiff-darwin-arm64
          - runner: macos-15-intel
            target: bun-darwin-x64
            asset: adiff-darwin-x64
          - runner: ubuntu-latest
            target: bun-linux-x64
            asset: adiff-linux-x64
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            asset: adiff-linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - run: npm install -g --allow-scripts=pnpm pnpm@12.0.0-beta.3

      - run: pnpm install --frozen-lockfile

      - name: compile for ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: bun build --compile --target="$TARGET" src/main.ts --outfile "$ASSET"

      - name: check it answers
        env:
          ASSET: ${{ matrix.asset }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          REPORTED=$(env -i "PATH=/usr/bin:/bin" "./$ASSET" --version)
          if [ "$REPORTED" != "$VERSION" ]; then
            echo "::error::The $ASSET binary reports $REPORTED where the release is $VERSION."
            exit 1
          fi
          env -i "PATH=/usr/bin:/bin" "./$ASSET" describe | node -e '
            const answer = JSON.parse(require("fs").readFileSync(0, "utf8"))
            if (answer.ok !== true) { throw new Error("describe did not answer ok") }
          '
          echo "::notice::$ASSET reports $VERSION and answers describe with no runtime on PATH."

      - name: attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          ASSET: ${{ matrix.asset }}
        run: gh release upload "v$VERSION" "$ASSET" --clobber

  formula:
    needs: [release, binaries]
    if: ${{ !cancelled() && needs.release.outputs.pending == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: check for the tap token
        id: tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -n "$TAP_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Add a TAP_TOKEN secret to have this workflow update the Homebrew formula on every release."
          fi

      - name: point the formula at the binaries
        if: steps.tap.outputs.configured == 'true'
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          BASE="https://github.com/${{ github.repository }}/releases/download/v$VERSION"
          fetch() {
            if ! curl -fsSL "$1" -o "$2"; then
              echo "::error::$1 is not on the release, so the formula is left pointing at the version it already builds. Rerun the binary job for v$VERSION, then rerun this one."
              exit 1
            fi
          }

          fetch "$BASE/adiff-darwin-arm64" "$RUNNER_TEMP/arm"
          fetch "$BASE/adiff-darwin-x64" "$RUNNER_TEMP/intel"

          TAP="$RUNNER_TEMP/tap"
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/Newbie012/homebrew-tap.git" "$TAP"

          VERSION="$VERSION" \
          ARM_URL="$BASE/adiff-darwin-arm64" \
          ARM_SHA="$(sha256sum "$RUNNER_TEMP/arm" | cut -d ' ' -f 1)" \
          INTEL_URL="$BASE/adiff-darwin-x64" \
          INTEL_SHA="$(sha256sum "$RUNNER_TEMP/intel" | cut -d ' ' -f 1)" \
          node scripts/formula.ts "$TAP/Formula/adiff.rb"

          git -C "$TAP" config user.name "github-actions[bot]"
          git -C "$TAP" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git -C "$TAP" diff --quiet; then
            echo "::notice::The formula already builds $VERSION."
            exit 0
          fi
          git -C "$TAP" commit -am "adiff $VERSION"
          git -C "$TAP" push
          echo "::notice::The Homebrew formula now installs the $VERSION binaries."
