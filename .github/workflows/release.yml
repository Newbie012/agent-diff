name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d
        with:
          version: 12.0.0-beta.3

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - id: plan
        run: |
          pnpm change status || true
          NAME=$(node -p "require('./package.json').name")
          if ! npm view "$NAME" version --json > /dev/null 2>&1; then
            echo "::notice::$NAME is not on the registry yet. Trusted publishing cannot create a package, so the first version must be published once by hand. Holding; no version will be applied."
            echo "pending=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if pnpm version -r --dry-run 2>&1 | grep -q '→'; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No pending change intents. Nothing to release."
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.plan.outputs.pending == 'true'
        run: pnpm typecheck && pnpm lint && pnpm test

      - if: steps.plan.outputs.pending == 'true'
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm version -r
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - if: steps.plan.outputs.pending == 'true'
        run: pnpm publish --tag alpha --no-git-checks

      - if: steps.plan.outputs.pending == 'true'
        run: |
          git commit -am "release ${{ steps.version.outputs.version }}" || true
          git tag "v${{ steps.version.outputs.version }}"
          git push origin HEAD:main --follow-tags
