name: wiki

on:
  push:
    branches: [main]
    paths: ["wiki/**"]
  workflow_dispatch:

concurrency:
  group: wiki
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Clone the wiki
        run: |
          if ! git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" published; then
            echo "::error::The wiki repository does not exist yet. Create one page in the wiki's web interface, then run this again." >&2
            exit 1
          fi

      - name: Take the pages from this commit
        run: |
          find published -maxdepth 1 -name '*.md' -delete
          cp wiki/*.md published/

      - name: Publish what changed
        working-directory: published
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --quiet --cached; then
            echo "The wiki already reads the same as wiki/ at ${{ github.sha }}."
            exit 0
          fi
          git commit -m "The wiki reads ${{ github.sha }}"
          git push
